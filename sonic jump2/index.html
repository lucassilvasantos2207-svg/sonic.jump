<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sonic Jump</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- TELA DE MENU -->
    <div class="menu" id="menu">
        <div class="logo">SONIC<span>JUMP</span></div>
        <button class="btn-play" id="btnPlay">JOGAR</button>
    </div>

    <!-- TELA DO JOGO -->
    <div class="game-board" id="gameBoard">
        <!-- Interface de Pontuação -->
        <div class="contador">PONTOS:<span id="score">0</span></div>
        
        <!-- Elementos do Cenário -->
        <img src="./imagem/nuvem.png.png" class="nuvem">
        <img src="./imagem/nuvem.png.png" class="nuvem2">
        <img src="./imagem/palmeira.png" class="palmeira">
        <img src="./imagem/palmeira.png" class="palmeira2">
        
        <div class="grama"></div>
        <div class="chao"></div>
        
        <!-- Personagens e Objetos -->
        <img src="./imagem/sonic correndo.gif.gif" class="sonic" id="sonic">
        <img src="./imagem/argola.png" class="moeda" id="moeda">
        <img src="./imagem/espinho.webp.webp" class="espinho" id="espinho">
        
        <!-- Controles Mobile -->
        <button class="btn-jump" id="btnJump">PULAR</button>

        <!-- Tela de Game Over -->
        <div class="game-over" id="gameOverScreen">
            <h1>GAME OVER</h1>
            <button class="btn-restart" id="btnRestart">JOGAR DE NOVO</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
